const RISK={avoid:{color:RED,bg:RED_LT,border:RED_BD,label:"Avoid"},caution:{color:GOLD,bg:GOLD_LT,border:GOLD_MID,label:"Caution"}};

function positionRisk(a,term,list){const idx=list.toLowerCase().indexOf(term.toLowerCase());if(idx>=0&&idx/list.length<0.3&&a.riskProfile==="caution")return{...a,riskProfile:"avoid",positionWarning:true};return a;}
function getVerdict(hits){if(!hits.length)return"safe";if(hits.some(h=>h.riskProfile==="avoid"))return"avoid";return"caution";}
function runCheck(text){const lower=text.toLowerCase();const hits=[],clean=[];ALLERGENS.forEach(a=>{const matched=a.terms.filter(t=>lower.includes(t));if(matched.length)hits.push({...positionRisk(a,matched[0],text),matched});else clean.push(a.name);});hits.sort((a,b)=>({avoid:0,caution:1}[a.riskProfile]-{avoid:0,caution:1}[b.riskProfile]));return{hits,clean,verdict:getVerdict(hits)};}
function searchDatabase(query){if(!query.trim())return[];const q=query.toLowerCase();return PRODUCT_DB.filter(p=>p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)).slice(0,6);}

function SeverityDots({severity}){const c=severity===3?RED:severity===2?GOLD:GOLD_MID;return <span style={{display:"inline-flex",gap:3,alignItems:"center"}}>{[1,2,3].map(i=><span key={i} style={{width:6,height:6,borderRadius:"50%",background:i<=severity?c:BORDER}}/>)}</span>;}

function ResultsView({results,expanded,setExpanded,animKey}){
  const pf={fontFamily:"'Playfair Display',serif"};
  return(
    <div key={animKey} className="fade-up" style={{marginTop:20}}>
      {results.verdict==="safe"&&<div style={{background:GREEN_LT,border:`1.5px solid ${GREEN_BD}`,borderRadius:14,padding:"18px 20px",marginBottom:16}}><div style={{...pf,fontSize:20,fontWeight:600,color:GREEN,marginBottom:5}}>All clear</div><p style={{color:"#1E6B4F",fontSize:13,lineHeight:1.6,margin:0}}>No allergens detected. Always verify the physical label — formulas change.</p></div>}
      {results.verdict==="avoid"&&<div style={{background:RED_LT,border:`1.5px solid ${RED_BD}`,borderRadius:14,padding:"18px 20px",marginBottom:16}}><div style={{...pf,fontSize:20,fontWeight:600,color:RED,marginBottom:5}}>Do not use</div><p style={{color:"#A0302B",fontSize:13,lineHeight:1.6,margin:0}}>{results.hits.filter(h=>h.riskProfile==="avoid").length} allergen{results.hits.filter(h=>h.riskProfile==="avoid").length>1?"s":""} with moderate-to-strong reactions detected.</p></div>}
      {results.verdict==="caution"&&<div style={{background:GOLD_LT,border:`1.5px solid ${GOLD_MID}`,borderRadius:14,padding:"18px 20px",marginBottom:16}}><div style={{...pf,fontSize:20,fontWeight:600,color:"#8B6820",marginBottom:5}}>Proceed with care</div><p style={{color:"#7A5C18",fontSize:13,lineHeight:1.6,margin:0}}>Mild allergen detected. Read the notes below.</p></div>}
      {results.hits.length>0&&["avoid","caution"].map(profile=>{const phits=results.hits.filter(h=>h.riskProfile===profile);if(!phits.length)return null;const r=RISK[profile];return<div key={profile} style={{marginBottom:14}}><div style={{fontSize:10,fontWeight:700,color:r.color,letterSpacing:2,textTransform:"uppercase",marginBottom:8}}>{r.label} — {phits.length} allergen{phits.length>1?"s":""}</div>{phits.map(h=>(<div key={h.id} onClick={()=>setExpanded(expanded===h.id?null:h.id)} style={{background:r.bg,border:`1.5px solid ${r.border}`,borderRadius:12,padding:"14px 16px",marginBottom:8,cursor:"pointer"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:5}}><span style={{fontWeight:600,color:r.color,fontSize:14}}>{h.name}</span><SeverityDots severity={h.severity}/>{h.positionWarning&&<span style={{background:r.color+"22",color:r.color,fontSize:10,fontWeight:600,padding:"2px 7px",borderRadius:20}}>High in list</span>}</div><div style={{fontSize:12,color:INK2}}>Detected: <strong>{h.matched.join(", ")}</strong></div></div><span style={{color:INK3,fontSize:13,marginLeft:8}}>{expanded===h.id?"▲":"▼"}</span></div>{expanded===h.id&&<div className="fade-in" style={{marginTop:12,paddingTop:12,borderTop:`1px solid ${r.border}`,fontSize:13,color:INK2,lineHeight:1.7}}>{h.clinicalNote}</div>}</div>))}</div>;})}
      {results.hits.length>0&&results.clean.length>0&&<div style={{background:CARD2,border:`1px solid ${BORDER}`,borderRadius:12,padding:"14px 16px",marginBottom:14}}><div style={{fontSize:11,fontWeight:600,color:INK3,letterSpacing:0.5,marginBottom:8}}>NOT DETECTED — {results.clean.length} allergens</div><div style={{display:"flex",flexWrap:"wrap",gap:5}}>{results.clean.map(c=><span key={c} style={{background:CARD,border:`1px solid ${BORDER}`,color:INK2,fontSize:11,padding:"3px 8px",borderRadius:20}}>{c}</span>)}</div></div>}
    </div>
  );
}

                    <div key={a.id} onClick={()=>setExpanded(isExp?null:a.id+"_a")} style={{background:CARD,border:`1px solid ${isExp?r.border:BORDER}`,borderRadius:12,padding:"13px 16px",marginBottom:8,cursor:"pointer"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}><span style={{fontWeight:600,fontSize:13,color:INK}}>{a.name}</span><SeverityDots severity={a.severity}/><span style={{background:r.bg,color:r.color,fontSize:10,fontWeight:600,padding:"2px 8px",borderRadius:20}}>{r.label}</span></div>
                        <span style={{color:INK3,fontSize:12}}>{isExp?"▲":"▼"}</span>
                      </div>
                      {isExp&&<div className="fade-in"><div style={{fontSize:13,color:INK2,lineHeight:1.7,margin:"12px 0 10px",paddingTop:12,borderTop:`1px solid ${BORDER}`}}>{a.clinicalNote}</div><div style={{fontSize:10,fontWeight:700,color:INK3,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>Also listed as</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{a.terms.map(t=><span key={t} style={{background:CARD2,border:`1px solid ${BORDER}`,color:INK2,fontSize:11,padding:"2px 8px",borderRadius:20}}>{t}</span>)}</div></div>}
                    </div>
                  );})}
                </div>
              );
            })}
            <div style={{background:INK,borderRadius:14,padding:20,marginTop:4}}>
              <div style={{fontWeight:600,color:GOLD,fontSize:13,marginBottom:12}}>For doctors & product inquiries</div>
              <div style={{fontFamily:"monospace",fontSize:11,color:"#C8C0B8",lineHeight:2}}>
                {ALLERGENS.map((a,i)=><div key={a.id}>{i+1}. {a.name} ({a.severity===3?"Strong +3":a.severity===2?"Moderate +2":"Mild +1"}) — {a.terms.slice(0,3).join(", ")}</div>)}
              </div>
            </div>
          </div>
        )}
      </div>
      <div style={{borderTop:`1px solid ${BORDER}`,padding:"14px 24px",textAlign:"center",background:CARD}}>
        <span style={{...pf,color:GOLD,fontSize:14}}>Allergyze</span>
        <span style={{color:INK3,fontSize:11,margin:"0 10px"}}>·</span>
        <span style={{color:INK3,fontSize:11}}>Always verify physical labels · Not medical advice · Formulas change</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
